name: AutoPoster v0.7 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android unit tests and debug build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Install Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Generate v0.6 Room schema v1
        run: |
          gradle -p tools/room-v1-export :legacy:assembleDebug --stacktrace
          mkdir -p app/schemas/com.example.autoposter.AppDatabase
          cp tools/room-v1-export/legacy/schemas/com.example.autoposter.AppDatabase/1.json app/schemas/com.example.autoposter.AppDatabase/1.json
      - name: Run Kotlin unit tests
        run: gradle :app:testDebugUnitTest --stacktrace
      - name: Assemble debug APK and instrumentation APK
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Commit generated Room schema exports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/schemas/com.example.autoposter.AppDatabase/1.json app/schemas/com.example.autoposter.AppDatabase/2.json
          if ! git diff --cached --quiet; then
            git commit -m "Add generated Room v0.6 and v0.7 schemas"
            git push
          fi
      - name: Upload Room schema exports
        uses: actions/upload-artifact@v4
        with:
          name: autoposter-v0.7-room-schemas
          path: app/schemas/**/*.json
          if-no-files-found: error
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: autoposter-v0.7-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Upload Android test APK
        uses: actions/upload-artifact@v4
        with:
          name: autoposter-v0.7-android-test-apk
          path: app/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: warn
      - name: Run Room migration and database instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          emulator-boot-timeout: 900
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -camera-back none -gpu swiftshader_indirect -memory 4096 -cores 2
          disable-animations: false
          script: bash scripts/run_android_instrumentation.sh
      - name: Upload instrumentation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autoposter-v0.7-instrumentation-diagnostics
          path: app/build/diagnostics/
          if-no-files-found: ignore

  ai-gateway:
    name: AI gateway tests and static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test AI gateway
        run: node --experimental-strip-types --test supabase/functions/ai-gateway/core.test.ts supabase/functions/ai-gateway/handler.test.ts
      - name: Check migrations
        run: python scripts/check_migration_sql.py
      - name: Check for provider secrets in Android source
        run: bash scripts/check_no_ai_keys.sh
