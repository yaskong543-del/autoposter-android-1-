name: Android CI
on:
  workflow_dispatch:
  push:
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Optional. Public values only; the build works without them (local mode).
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.13 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: AI gateway tests (Node)
        run: cd supabase/functions/ai-gateway && node --experimental-strip-types --test core.test.ts handler.test.ts
      - name: No AI keys in the app
        run: bash scripts/check_no_ai_keys.sh
      - name: Room 1->2 migration SQL is valid and repeatable
        run: python3 scripts/check_migration_sql.py
      - name: Unit + integration tests
        run: gradle :app:testDebugUnitTest --stacktrace
      - name: Build debug APK and compile instrumented tests
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: app/build/reports/tests/
      - uses: actions/upload-artifact@v4
        with:
          name: AutoPoster-apk
          path: app/build/outputs/apk/debug/*.apk
