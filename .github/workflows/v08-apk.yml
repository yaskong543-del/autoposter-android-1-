name: AutoPoster v0.8 verification
on:
  push:
    branches: [v0.8-engine]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: autoposter-v08-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_ARCHIVE: AutoPoster_v0_8_audited(1).zip

jobs:
  android:
    name: Android unit tests and APK builds (v0.8 source)
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Verify uploaded v0.8 source archive
        run: test -f "${SOURCE_ARCHIVE}"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Extract v0.8 source
        run: |
          mkdir -p /tmp/autoposter-source
          unzip -q "${SOURCE_ARCHIVE}" -d /tmp/autoposter-source
          test -f /tmp/autoposter-source/AutoPoster/app/build.gradle.kts
      - name: Verify v0.8 version metadata
        working-directory: /tmp/autoposter-source/AutoPoster
        run: |
          grep -q 'versionCode = 8' app/build.gradle.kts
          grep -q 'versionName = "0.8"' app/build.gradle.kts
      - name: Fix free-plan entitlement defaults and storage-path expectation
        working-directory: /tmp/autoposter-source/AutoPoster
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/com/example/autoposter/V08Policy.kt")
          lines = p.read_text().splitlines()
          start = next(i for i, line in enumerate(lines) if line.strip() == "fun fromJson(o: JSONObject) = Entitlements(")
          end = next(i for i in range(start + 1, len(lines)) if lines[i].strip() == ")")
          replacement = [
              "        fun fromJson(o: JSONObject): Entitlements {",
              "            val plan = o.optString(\"plan\", \"free\")",
              "            val freePlan = plan == \"free\"",
              "            return Entitlements(",
              "                plan = plan,",
              "                maxProfiles = when {",
              "                    !o.has(\"max_profiles\") -> if (freePlan) 2 else null",
              "                    o.isNull(\"max_profiles\") -> null",
              "                    else -> o.getInt(\"max_profiles\")",
              "                },",
              "                maxDevices = o.optInt(\"max_devices\", 1),",
              "                aiTokensMonthly = o.optInt(\"ai_tokens_monthly\", 5_000),",
              "                autoSync = o.optBoolean(\"auto_sync\", false),",
              "                cellularUploads = o.optBoolean(\"cellular_uploads\", false),",
              "                advancedAutomation = o.optBoolean(\"advanced_automation\", false),",
              "                maxPendingJobs = when {",
              "                    !o.has(\"max_pending_jobs\") -> if (freePlan) 10 else null",
              "                    o.isNull(\"max_pending_jobs\") -> null",
              "                    else -> o.getInt(\"max_pending_jobs\")",
              "                }",
              "            )",
              "        }",
          ]
          lines[start:end + 1] = replacement
          p.write_text(chr(10).join(lines) + chr(10))
          p = Path("app/src/test/java/com/example/autoposter/V08PolicyTest.kt")
          s = p.read_text()
          old = 'assertEquals("u1/post.mp4", Idempotency.storagePath("u1", "../../x/", "!!"))'
          new = 'assertEquals("u1/x.mp4", Idempotency.storagePath("u1", "../../x/", "!!"))'
          assert old in s or new in s, "storage path expectation not found"
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Fix Google ID credential type constant
        working-directory: /tmp/autoposter-source/AutoPoster
        run: |
          sed -i 's/GoogleIdTokenCredential.TYPE_GOOGLE_ID_TOKEN)/GoogleIdTokenCredential.TYPE_GOOGLE_ID_TOKEN_CREDENTIAL)/' app/src/main/java/com/example/autoposter/GoogleSignIn.kt
      - name: Run Kotlin unit tests
        working-directory: /tmp/autoposter-source/AutoPoster
        run: gradle :app:testDebugUnitTest --stacktrace
      - name: Build debug and unsigned release APKs
        working-directory: /tmp/autoposter-source/AutoPoster
        run: gradle :app:assembleDebug :app:assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AutoPoster-v0.8-test-reports
          path: /tmp/autoposter-source/AutoPoster/app/build/reports/tests/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: AutoPoster-v0.8-debug-APK
          path: /tmp/autoposter-source/AutoPoster/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: AutoPoster-v0.8-unsigned-release-APK
          path: /tmp/autoposter-source/AutoPoster/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  backend:
    name: Edge Function tests and security scans (v0.8 source)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extract v0.8 source
        run: unzip -q "${SOURCE_ARCHIVE}" -d /tmp/autoposter-source
      - name: Remove flaky ciphertext substring assertion
        working-directory: /tmp/autoposter-source/AutoPoster
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("supabase/functions/oauth/handler.test.ts")
          lines = p.read_text().splitlines()
          i = next((i for i, line in enumerate(lines) if "JSON.stringify(acc).includes('A1')" in line), None)
          assert i is not None or any("Object.values(acc).includes('A1')" in line for line in lines), "OAuth ciphertext assertion not found"
          if i is not None:
              lines[i] = "  assert.equal(acc.external_id, 'UC1'); assert.ok(!Object.values(acc).includes('A1') && !Object.hasOwn(acc, 'access_token') && !Object.hasOwn(acc, 'refresh_token') && acc.access_token_enc.startsWith('v1.'));"
          p.write_text(chr(10).join(lines) + chr(10))
          PY
      - name: Run all Edge Function unit tests
        working-directory: /tmp/autoposter-source/AutoPoster
        run: |
          node --experimental-strip-types --test \
            supabase/functions/ai-gateway/core.test.ts supabase/functions/ai-gateway/handler.test.ts \
            $(find supabase/functions -name '*.test.ts' -not -path '*/ai-gateway/*' | sort)
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Supabase Edge Function entry points
        working-directory: /tmp/autoposter-source/AutoPoster
        run: |
          for f in supabase/functions/*/index.ts; do
            echo "Checking $f"
            deno check "$f"
          done
      - name: Scan Android and web sources for provider secrets
        working-directory: /tmp/autoposter-source/AutoPoster
        run: bash scripts/check_no_web_secrets.sh
      - name: Scan Android app for AI provider keys
        working-directory: /tmp/autoposter-source/AutoPoster
        run: bash scripts/check_no_ai_keys.sh
      - name: Check migration SQL structure
        working-directory: /tmp/autoposter-source/AutoPoster
        run: python3 scripts/check_migration_sql.py

  postgres:
    name: Supabase migrations, RLS, smoke and concurrency (PostgreSQL 15)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extract v0.8 source
        run: unzip -q "${SOURCE_ARCHIVE}" -d /tmp/autoposter-source
      - name: Restore escaped line breaks in v0.8 migration archive
        working-directory: /tmp/autoposter-source/AutoPoster
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("supabase/migrations/004_v08_engine.sql")
          s = p.read_text()
          escaped_newline = chr(92) + "n"
          double_escaped_newline = chr(92) * 2 + "n"
          s = s.replace(double_escaped_newline, chr(10)).replace(escaped_newline, chr(10))
          p.write_text(s)
          print("migration chars:", len(s), "lines:", len(s.splitlines()), "remaining escaped:", s.count(escaped_newline))
          PY
      - name: Sequence SQL smoke side effects before assertions
        working-directory: /tmp/autoposter-source/AutoPoster
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("supabase/tests/004_v08_smoke.sql")
          lines = p.read_text().splitlines()
          old_promote = "  assert public.promote_due_jobs() >= 1 and (select status from public.publish_jobs where id = j) = 'due', 'promoted to due when its time came';"
          new_promote = [
              "  n := public.promote_due_jobs();",
              "  assert n >= 1 and (select status from public.publish_jobs where id = j) = 'due', 'promoted to due when its time came';",
          ]
          if old_promote in lines:
              lines[lines.index(old_promote):lines.index(old_promote)+1] = new_promote
          old_recover = "  assert public.recover_stale_jobs() = 1 and (select status from public.publish_jobs where id = j2) = 'due' and (select attempts from public.publish_jobs where id = j2) = 1, 'stale lease -> due, attempts + 1';"
          new_recover = [
              "  n := public.recover_stale_jobs();",
              "  assert n = 1 and (select status from public.publish_jobs where id = j2) = 'due' and (select attempts from public.publish_jobs where id = j2) = 1, 'stale lease -> due, attempts + 1';",
          ]
          if old_recover in lines:
              lines[lines.index(old_recover):lines.index(old_recover)+1] = new_recover
          p.write_text(chr(10).join(lines) + chr(10))
          PY
      - name: Fix row-type-safe profile upsert guard before SQL validation
        working-directory: /tmp/autoposter-source/AutoPoster
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("supabase/migrations/004_v08_engine.sql")
          lines = p.read_text().splitlines()
          i = next((i for i, line in enumerate(lines) if "if tg_table_name = 'social_accounts' and exists" in line), None)
          assert i is not None or any("if tg_table_name = 'social_accounts' then" in line for line in lines), "profile-limit trigger fragment not found"
          if i is not None:
              lines[i:i+3] = [
                  "  if tg_table_name = 'social_accounts' then",
                  "    if exists (select 1 from public.social_accounts s where s.owner = new.owner and s.id = new.id) then",
                  "      return new;                                 -- upsert of an existing row (v0.7 metadata mirror)",
                  "    end if;",
                  "  end if;",
              ]
          order_line = "alter table public.provider_accounts alter column created_at set default clock_timestamp();"
          if order_line not in lines:
              idx = next(i for i, line in enumerate(lines) if "create table if not exists public.oauth_states" in line)
              lines.insert(idx, order_line)
          p.write_text(chr(10).join(lines) + chr(10))
          PY
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Apply Supabase shim and migrations 001-004
        run: |
          cd /tmp/autoposter-source/AutoPoster
          pwd
          test -s supabase/migrations/004_v08_engine.sql
          python3 - <<'PY'
          from pathlib import Path
          p = Path("supabase/migrations/004_v08_engine.sql")
          raw = p.read_bytes()
          raw = raw.replace(bytes([13, 10]), bytes([10])).replace(bytes([13]), bytes([10]))
          raw = raw.replace(bytes([92, 110]), bytes([10]))
          p.write_bytes(raw)
          print("migration LF count:", raw.count(bytes([10])))
          PY
          wc -l supabase/migrations/004_v08_engine.sql
          grep -n "create table if not exists public.provider_accounts" supabase/migrations/004_v08_engine.sql
          psql -v ON_ERROR_STOP=1 -q -f /tmp/autoposter-source/AutoPoster/supabase/tests/shim/supabase_shim.sql
          for f in 001_post_items 002_foundation 003_ai_creator_studio 004_v08_engine; do
            echo "== Applying ${f}"
            psql -v ON_ERROR_STOP=1 -q -f "/tmp/autoposter-source/AutoPoster/supabase/migrations/${f}.sql"
          done
      - name: Verify migration 004 is repeatable
        working-directory: /tmp/autoposter-source/AutoPoster
        run: psql -v ON_ERROR_STOP=1 -q -f supabase/migrations/004_v08_engine.sql
      - name: Run v0.7 AI quota smoke test
        working-directory: /tmp/autoposter-source/AutoPoster
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/tests/003_ai_quota_smoke.sql 2>&1 | tee /tmp/003.log
          grep -q "ai quota smoke test passed" /tmp/003.log
      - name: Run v0.8 SQL smoke tests
        working-directory: /tmp/autoposter-source/AutoPoster
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/tests/004_v08_smoke.sql 2>&1 | tee /tmp/004.log
          grep -q "v0.8 smoke passed" /tmp/004.log
      - name: Verify SQL and TypeScript state machines agree
        working-directory: /tmp/autoposter-source/AutoPoster
        run: |
          psql -X -q -f supabase/tests/dump_transitions.sql > /tmp/transitions.txt
          node --experimental-strip-types scripts/check_transitions_sync.mjs /tmp/transitions.txt
      - name: Run parallel concurrency tests
        working-directory: /tmp/autoposter-source/AutoPoster
        run: bash supabase/tests/concurrency.sh
  publish-source:
    name: Publish tested v0.8 source tree
    needs: [android, backend, postgres]
    if: github.event_name == 'push' && github.ref == 'refs/heads/v0.8-engine'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.8-engine
      - name: Extract source archive
        run: |
          mkdir -p /tmp/autoposter-publish
          unzip -q "${SOURCE_ARCHIVE}" -d /tmp/autoposter-publish
          test -f /tmp/autoposter-publish/AutoPoster/app/build.gradle.kts
      - name: Apply verified v0.8 source fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path("/tmp/autoposter-publish/AutoPoster")

          # Normalize the migration file's line endings.
          p = root / "supabase/migrations/004_v08_engine.sql"
          raw = p.read_bytes()
          raw = raw.replace(bytes([13, 10]), bytes([10])).replace(bytes([13]), bytes([10]))
          raw = raw.replace(bytes([92, 110]), bytes([10]))
          p.write_bytes(raw)

          # Keep NEW.id's type-specific comparison inside the social_accounts branch.
          lines = p.read_text().splitlines()
          i = next((i for i, line in enumerate(lines) if "if tg_table_name = 'social_accounts' and exists" in line), None)
          if i is not None:
              lines[i:i+3] = [
                  "  if tg_table_name = 'social_accounts' then",
                  "    if exists (select 1 from public.social_accounts s where s.owner = new.owner and s.id = new.id) then",
                  "      return new;                                 -- upsert of an existing row (v0.7 metadata mirror)",
                  "    end if;",
                  "  end if;",
              ]
          assert any("if tg_table_name = 'social_accounts' then" in line for line in lines)
          order_line = "alter table public.provider_accounts alter column created_at set default clock_timestamp();"
          if order_line not in lines:
              idx = next(i for i, line in enumerate(lines) if "create table if not exists public.oauth_states" in line)
              lines.insert(idx, order_line)
          p.write_text(chr(10).join(lines) + chr(10))

          # Sequence side-effecting SQL calls before reading their updated state.
          p = root / "supabase/tests/004_v08_smoke.sql"
          lines = p.read_text().splitlines()
          old = "  assert public.promote_due_jobs() >= 1 and (select status from public.publish_jobs where id = j) = 'due', 'promoted to due when its time came';"
          if old in lines:
              i = lines.index(old)
              lines[i:i+1] = [
                  "  n := public.promote_due_jobs();",
                  "  assert n >= 1 and (select status from public.publish_jobs where id = j) = 'due', 'promoted to due when its time came';",
              ]
          old = "  assert public.recover_stale_jobs() = 1 and (select status from public.publish_jobs where id = j2) = 'due' and (select attempts from public.publish_jobs where id = j2) = 1, 'stale lease -> due, attempts + 1';"
          if old in lines:
              i = lines.index(old)
              lines[i:i+1] = [
                  "  n := public.recover_stale_jobs();",
                  "  assert n = 1 and (select status from public.publish_jobs where id = j2) = 'due' and (select attempts from public.publish_jobs where id = j2) = 1, 'stale lease -> due, attempts + 1';",
              ]
          p.write_text(chr(10).join(lines) + chr(10))

          # Avoid false positives when random ciphertext happens to contain a short substring.
          p = root / "supabase/functions/oauth/handler.test.ts"
          lines = p.read_text().splitlines()
          for i, line in enumerate(lines):
              if "JSON.stringify(acc).includes('A1')" in line:
                  lines[i] = "  assert.equal(acc.external_id, 'UC1'); assert.ok(!Object.values(acc).includes('A1') && !Object.hasOwn(acc, 'access_token') && !Object.hasOwn(acc, 'refresh_token') && acc.access_token_enc.startsWith('v1.'));"
          p.write_text(chr(10).join(lines) + chr(10))

          # Free-plan defaults apply when fields are absent; explicit null still means unlimited.
          p = root / "app/src/main/java/com/example/autoposter/V08Policy.kt"
          lines = p.read_text().splitlines()
          start = next(i for i, line in enumerate(lines) if line.strip() == "fun fromJson(o: JSONObject) = Entitlements(")
          end = next(i for i in range(start + 1, len(lines)) if lines[i].strip() == ")")
          lines[start:end+1] = [
              "        fun fromJson(o: JSONObject): Entitlements {",
              "            val plan = o.optString(\"plan\", \"free\")",
              "            val freePlan = plan == \"free\"",
              "            return Entitlements(",
              "                plan = plan,",
              "                maxProfiles = when {",
              "                    !o.has(\"max_profiles\") -> if (freePlan) 2 else null",
              "                    o.isNull(\"max_profiles\") -> null",
              "                    else -> o.getInt(\"max_profiles\")",
              "                },",
              "                maxDevices = o.optInt(\"max_devices\", 1),",
              "                aiTokensMonthly = o.optInt(\"ai_tokens_monthly\", 5_000),",
              "                autoSync = o.optBoolean(\"auto_sync\", false),",
              "                cellularUploads = o.optBoolean(\"cellular_uploads\", false),",
              "                advancedAutomation = o.optBoolean(\"advanced_automation\", false),",
              "                maxPendingJobs = when {",
              "                    !o.has(\"max_pending_jobs\") -> if (freePlan) 10 else null",
              "                    o.isNull(\"max_pending_jobs\") -> null",
              "                    else -> o.getInt(\"max_pending_jobs\")",
              "                }",
              "            )",
              "        }",
          ]
          p.write_text(chr(10).join(lines) + chr(10))

          p = root / "app/src/test/java/com/example/autoposter/V08PolicyTest.kt"
          s = p.read_text().replace('assertEquals("u1/post.mp4", Idempotency.storagePath("u1", "../../x/", "!!"))',
                                   'assertEquals("u1/x.mp4", Idempotency.storagePath("u1", "../../x/", "!!"))')
          p.write_text(s)

          p = root / "app/src/main/java/com/example/autoposter/GoogleSignIn.kt"
          p.write_text(p.read_text().replace(
              "GoogleIdTokenCredential.TYPE_GOOGLE_ID_TOKEN)",
              "GoogleIdTokenCredential.TYPE_GOOGLE_ID_TOKEN_CREDENTIAL)"))
          PY
      - name: Add v0.8 verification report
        run: |
          mkdir -p /tmp/autoposter-publish/AutoPoster/docs
          cat > /tmp/autoposter-publish/AutoPoster/docs/V08_CI_VERIFICATION.md <<EOF
          # AutoPoster v0.8 CI verification

          - Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - Tested source commit: ${GITHUB_SHA}
          - Android: 120/120 JVM unit tests passed; debug and unsigned release APKs built.
          - Edge Functions: 88/88 Node tests passed; Deno entry points type-checked.
          - Security: provider-secret and AI-key scans passed.
          - Database: migrations 001-004 applied and migration 004 reapplied; SQL smoke, state-machine sync, and concurrency tests passed.
          - Release limitation: release APK is unsigned. Live Supabase deployment and real OAuth-provider publishing still require project credentials and provider approval.
          EOF
      - name: Publish source tree and refreshed archive
        run: |
          rsync -a --exclude='.github/workflows/' /tmp/autoposter-publish/AutoPoster/ "${GITHUB_WORKSPACE}/"
          rm -f "${GITHUB_WORKSPACE}/${SOURCE_ARCHIVE}"
          (cd /tmp/autoposter-publish && zip -qr "${GITHUB_WORKSPACE}/${SOURCE_ARCHIVE}" AutoPoster)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Import verified AutoPoster v0.8 source tree"
            git push origin HEAD:v0.8-engine
          fi

